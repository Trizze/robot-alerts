<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Chest display test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#263330;color:#f3f5f4;font:16px system-ui,sans-serif}canvas#stage{width:100%;height:100%;display:block}.controls{position:absolute;right:4%;top:5%;width:320px;padding:20px;border-radius:12px;background:#18211f;box-shadow:0 8px 35px #0005}h1{font-size:22px;margin:0 0 10px}p{font-size:14px;line-height:1.4;color:#b7c9c3}select{width:100%;padding:10px;font:inherit}#detail{width:280px;height:200px;image-rendering:pixelated;background:#263330;margin-top:15px}</style><link rel="stylesheet" href="transport.css"></head><body><canvas id="stage"></canvas><section class="controls" data-chest-proof><h1>Chest display test</h1><p>Choose an alert to preview its chest text. The inset enlarges the display for inspection.</p><select id="chest-event" aria-label="Alert type"><option value="T1">Sub — tier 1</option><option value="T2">Sub — tier 2</option><option value="T3">Sub — tier 3</option><option value="PRIME">Sub — Prime</option><option value="12 MO">Resub — 12 months</option><option value="x5">Gift — 5 subs</option><option value="500">Cheer — 500 bits</option><option value="Hi!">Follow</option><option value="42">Raid — 42 viewers</option></select><canvas id="detail" width="280" height="200"></canvas></section><script type="module" src="proof.js"></script></body></html>
