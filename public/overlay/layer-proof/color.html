<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Robot layer color test</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#263330;color:#f3f5f4;font:16px system-ui,sans-serif}canvas{width:100%;height:100%;display:block}.controls{position:absolute;right:4%;top:5%;width:300px;max-height:85vh;overflow:auto;padding:20px;border-radius:12px;background:#18211f;box-shadow:0 8px 35px #0005}h1{font-size:22px;margin:0 0 8px}p{font-size:14px;line-height:1.4;color:#b7c9c3}label{display:flex;align-items:center;gap:10px;padding:7px 0}input{width:19px;height:19px}button{font:inherit;padding:8px 12px;margin:10px 5px 0 0;cursor:pointer}
</style><link rel="stylesheet" href="transport.css"></head><body><canvas id="stage"></canvas><section class="controls" data-color-proof><h1>Robot layer test</h1><p>Switch parts to the color-test version while the run-in plays.</p><label><input type="checkbox" data-layer="head">Head and CRT frame</label><label><input type="checkbox" data-layer="screen">Screen mask</label><label><input type="checkbox" data-layer="torso">Torso</label><label><input type="checkbox" data-layer="arm_l">Left arm</label><label><input type="checkbox" data-layer="arm_r">Right arm</label><label><input type="checkbox" data-layer="legs">Legs</label><label><input type="checkbox" data-layer="chest">Chest</label><button type="button" data-all="on">All colors</button><button type="button" data-all="off">All original</button><p>The screen mask is white in both sets; your profile picture is drawn separately.</p></section><script type="module" src="proof.js"></script></body></html>
